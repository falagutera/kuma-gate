# nginx in front of kuma-gate. One server block per host; TLS as you usually do it.
# kuma-gate decides what each host may see: the admin host (KUMAGATE_BASE_URL) gets
# everything after sign-in, the KUMAGATE_STATUS_HOSTS only Kuma's public paths.

# http {} level -------------------------------------------------------------------------

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Push URLs carry their token in the path: keep it out of the access log.
map $request_uri $kuma_gate_uri {
    ~*^/api/push/  "/api/push/[redacted]";
    default        $request_uri;
}
log_format kuma_gate '$remote_addr - $remote_user [$time_local] "$request_method $kuma_gate_uri $server_protocol" '
                     '$status $body_bytes_sent "$http_referer" "$http_user_agent"';

# Anyone can call the public API paths; Kuma does real work for each. Per client address.
limit_req_zone $binary_remote_addr zone=kuma_gate_public:10m rate=10r/s;

upstream kuma_gate {
    server 127.0.0.1:3003;
    keepalive 16;
}

# server {} ------------------------------------------------------------------------------

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name status.example.org status.example.com;   # the admin host and the status hosts

    ssl_certificate     /etc/letsencrypt/live/status.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/status.example.org/privkey.pem;

    access_log /var/log/nginx/kuma-gate.access.log kuma_gate;
    client_max_body_size 4m;           # kuma-gate enforces its own, smaller, limits

    # inherited by the locations below
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Forwarded-For   $remote_addr;   # one address; kuma-gate trusts 127.0.0.1
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade           $http_upgrade;  # socket.io websocket
    proxy_set_header Connection        $connection_upgrade;
    proxy_read_timeout  1h;            # a websocket is quiet between socket.io pings (25 s)
    proxy_send_timeout  1h;
    proxy_buffering off;

    # the public API: status page data, badges, push
    location ~ ^/api/(status-page|badge|push)/ {
        limit_req zone=kuma_gate_public burst=40 nodelay;
        limit_req_status 429;
        proxy_pass http://kuma_gate;
    }

    location / {
        proxy_pass http://kuma_gate;
    }
}
