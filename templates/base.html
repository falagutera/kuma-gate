{{define "head"}}<!doctype html>
<html lang="{{.Lang}}" data-family="{{.Family}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{.T.title}}</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="/assets/style.css?v={{.Version}}">
</head>
<body>
<div class="wrap">
<header class="top">
  <a class="brand" href="/dashboard"><span class="bubble"></span>{{.T.title}}</a>
  <nav class="toplinks">
    <a class="toggle" href="/release-notes"{{if .Notes}} aria-current="page"{{end}}>{{.T.notes}}</a>
    <span class="langsel"><a href="?lang=pt"{{if eq .Lang "pt"}} aria-current="true"{{end}}>PT</a>·<a href="?lang=en"{{if eq .Lang "en"}} aria-current="true"{{end}}>EN</a></span>
  </nav>
</header>
<main>
{{end}}
{{define "foot"}}</main>
<footer>
  <a href="/release-notes">kuma-gate {{.Version}}</a> ·
  <a href="https://gitlab.gutocarvalho.net/open/gcn/kuma-gate">{{.T.source}}</a> ·
  {{if eq .Family "gcn"}}{{.T.part_of_gcn}} <a href="https://gutocarvalho.net">gutocarvalho.net</a>{{else}}{{.T.part_of}} <a href="https://bolha.io">bolha.io</a>{{end}}
</footer>
</div>
</body>
</html>
{{end}}
